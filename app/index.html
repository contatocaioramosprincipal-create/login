<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXIS Lab · Plataforma para médicos</title>
<meta name="description" content="Ferramentas gratuitas para o consultório: quanto cobrar, convênios que valem a pena, documentos, raio-X do consultório, scripts para a secretária e LGPD.">
<meta name="theme-color" content="#0F2A22">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXIS Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --forest:#0F2A22;--deep:#09201A;--panel:#13362B;--line:rgba(242,235,221,.12);
  --cream:#F2EBDD;--paper:#FBF8F2;--ink:#14231D;--mute:#5d6b65;--faint:#8a958f;--rule:#e4ddcf;
  --sage:#7FB89A;--sage-2:#A9D4BC;--sage-d:#2f6b4c;--gold:#D3B477;--red:#b4432f;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Instrument Sans',system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--forest);color:var(--cream);padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--display);letter-spacing:.32em;font-size:15px}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--sage-2);border:1px solid rgba(169,212,188,.35);border-radius:999px;padding:3px 8px}
.bar-r{display:flex;align-items:center;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid rgba(242,235,221,.22);background:transparent;color:var(--cream);font-size:14px;cursor:pointer;text-decoration:none}
.chipbtn:hover{border-color:var(--sage)}
.chipbtn.solid{background:var(--cream);color:var(--forest);border-color:var(--cream);font-weight:600}
.chipbtn svg{width:16px;height:16px}

/* buttons/forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;border:0;background:var(--forest);color:var(--cream);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#163a2f}
.btn.ghost{background:transparent;color:var(--forest);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--forest)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px}
.btn:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tool:focus-visible{outline:2px solid var(--sage-d);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--rule);border-radius:12px;background:#fff}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{min-width:0}
.hint{font-size:12.5px;color:var(--faint);margin-top:5px}
.card{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:24px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-d)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--sage-d)}
.muted{color:var(--mute)}

/* onboarding */
.onb{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--forest)}
.onb-l{color:var(--cream);padding:56px max(24px,5vw);display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:radial-gradient(800px 500px at 20% 10%,rgba(127,184,154,.18),transparent 60%)}
.onb-l h1{font-size:clamp(34px,4vw,54px);margin-top:18px}
.onb-l h1 em{font-family:var(--serif);font-weight:400;color:var(--sage-2)}
.onb-l ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px;color:rgba(242,235,221,.75)}
.onb-l li{display:flex;gap:12px;align-items:baseline}
.onb-l li::before{content:"";width:16px;height:1px;background:var(--sage);transform:translateY(-4px);flex:none}
.onb-r{background:var(--paper);padding:56px max(24px,5vw);display:flex;align-items:center}
.onb-r form{width:100%;max-width:480px;margin:0 auto;display:grid;gap:16px}
.pw{position:relative}.pw input{padding-right:92px}.eye{position:absolute;right:6px;top:50%;translate:0 -50%;min-height:36px;padding:6px 12px;border:0;border-radius:999px;background:#efe9dd;font-size:13px;cursor:pointer}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mute)}
.consent input{width:20px;min-height:20px;height:20px;margin-top:2px;flex:none}

/* dashboard */
.hello{padding:36px 0 18px}
.hello h1{font-size:clamp(28px,3.4vw,40px)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:20px}
.tool{display:flex;flex-direction:column;gap:12px;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:20px;padding:22px;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0}
.tool:hover{transform:translateY(-2px);box-shadow:0 18px 40px -24px rgba(15,42,34,.45);border-color:#cfc6b4}
.tool .ic{width:44px;height:44px;border-radius:12px;background:#E6F1EA;color:var(--sage-d);display:grid;place-items:center}
.tool .ic svg{width:22px;height:22px}
.tool h3{font-size:19px}
.tool p{font-size:14.5px;color:var(--mute)}
.tool .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:auto}
.tool.soon{background:transparent;border-style:dashed}
.tool.soon .ic{background:#efe9dd;color:#8a7a55}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 14px}
.sec-t h2{font-size:22px}

/* tool view */
.view-h{padding:28px 0 18px;display:flex;flex-direction:column;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);text-decoration:none;min-height:40px}
.back:hover{color:var(--ink)}
.view-h h1{font-size:clamp(28px,3.4vw,40px)}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:start;padding-bottom:40px}
.res{position:sticky;top:84px;background:var(--forest);color:var(--cream);border-radius:22px;padding:26px;display:grid;gap:16px}
.res .big{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:-.02em}
.res .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-2)}
.res .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.res .row span:first-child{color:rgba(242,235,221,.7)}
.res .note{font-size:13px;color:rgba(242,235,221,.6)}
.res .btn{background:var(--cream);color:var(--forest)}
.form-sec{display:grid;gap:14px}
.form-sec h3{font-size:16px;font-family:var(--body);font-weight:600;margin-top:6px}

/* convenios table */
.cv{display:grid;gap:10px}
.cv-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 40px;gap:8px;align-items:end}
.cv-row .x{width:40px;height:46px;border:1px solid var(--rule);border-radius:12px;background:#fff;cursor:pointer;color:var(--mute)}
.bars{display:grid;gap:10px}
.barrow{display:grid;gap:4px}
.barrow .t{display:flex;justify-content:space-between;font-size:14px}
.barrow .t b{font-weight:600}
.track{height:10px;border-radius:999px;background:rgba(242,235,221,.12);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--sage)}
.fill.bad{background:#E39C7E}

/* doc preview */
.doc{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:48px 52px;color:#111;font-family:Georgia,'Times New Roman',serif;font-size:15.5px;line-height:1.7;min-height:520px;display:flex;flex-direction:column}
.doc .dh{border-bottom:1px solid #ccc;padding-bottom:14px;margin-bottom:28px;font-family:var(--body)}
.doc .dh b{font-size:17px;display:block}
.doc .dh small{color:#555;font-size:12.5px}
.doc h2{font-family:Georgia,serif;font-size:20px;text-align:center;letter-spacing:.1em;text-transform:uppercase;margin-bottom:26px}
.doc .body{white-space:pre-wrap;flex:1}
.doc .sign{margin-top:56px;text-align:center;font-family:var(--body);font-size:13.5px}
.doc .sign i{display:block;width:280px;max-width:100%;border-top:1px solid #333;margin:0 auto 8px}

/* raio-x */
.q{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--rule)}
.q:last-child{border-bottom:0}
.q b{font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--rule);background:#fff;cursor:pointer;font-size:14px}
.opt[aria-pressed="true"]{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.area{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-d);margin-top:18px}
.recs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.recs li{font-size:14.5px;padding-left:18px;position:relative;color:rgba(242,235,221,.85)}
.recs li::before{content:"";position:absolute;left:0;top:10px;width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* scripts / checklist */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.scr{display:grid;gap:14px;padding-bottom:40px}
.scr .card p{white-space:pre-wrap;font-size:15px}
.scr .card .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.scr .card h3{font-size:17px}
.ck{display:grid;gap:10px;padding-bottom:40px}
.ck label{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;color:var(--ink);font-size:15px;font-weight:400;cursor:pointer;margin:0}
.ck input{width:22px;height:22px;min-height:22px;flex:none;margin-top:1px;accent-color:var(--sage-d)}
.ck small{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.prog{height:12px;border-radius:999px;background:#e9e2d4;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--sage-d);border-radius:999px;transition:width .3s}

/* soon modal / toast */
dialog{border:0;border-radius:22px;padding:0;max-width:440px;width:calc(100% - 32px);box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(9,32,26,.6)}
.dlg{padding:28px;display:grid;gap:14px}
.dlg h3{font-size:22px}
.dlg ol{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));translate:-50% 0;background:var(--forest);color:var(--cream);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.on{opacity:1}
.foot{border-top:1px solid var(--rule);padding:22px 0 calc(22px + env(safe-area-inset-bottom));font-size:13px;color:var(--faint)}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .tools{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr}
  .res{position:static}
  .onb{grid-template-columns:1fr}
  .onb-l{padding-bottom:28px}
}
@media (max-width:560px){
  .tools{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .cv-row{grid-template-columns:1fr 1fr;}
  .cv-row .field:first-child{grid-column:1/-1}
  .doc{padding:28px 22px}
  .bar .chipbtn .t{display:none}
  .brand span{display:none}
}
@media print{
  body{background:#fff}
  .bar,.view-h,.form-col,.foot,.noprint,.toast{display:none!important}
  .split{display:block}
  .doc{border:0;padding:0;min-height:auto}
}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <div class="wrap">
    <a class="brand" href="#/" aria-label="AXIS Lab, início">
      <svg width="26" height="30" viewBox="0 0 44 50" aria-hidden="true"><polygon points="21,2 0,46 15,46" fill="#F2EBDD"/><polygon points="22,5 42,46 28,46 20.5,19" fill="#7FB89A"/></svg>
      <b>AXIS</b><span>LAB</span>
    </a>
    <div class="bar-r">
      <button class="chipbtn solid" type="button" data-install hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="t">Instalar app</span></button>
      <button class="chipbtn" type="button" id="logout" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l-5-5 5-5M5 12h12"/></svg><span class="t">Sair</span></button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="foot" id="foot" hidden><div class="wrap"><span>AXIS Lab · ferramentas gratuitas para médicos</span><a href="/">axismed.app.br</a></div></footer>

<dialog id="soonDlg"><div class="dlg">
  <div class="eyebrow">Em breve</div>
  <h3 id="soonT">Ferramenta</h3>
  <p class="muted" id="soonP"></p>
  <button class="btn" type="button" id="soonYes">Quero testar primeiro</button>
  <button class="btn ghost" type="button" onclick="this.closest('dialog').close()">Fechar</button>
</div></dialog>

<dialog id="installDlg"><div class="dlg">
  <div class="eyebrow">Instalar o app</div>
  <h3>Leve a AXIS Lab no celular</h3>
  <div id="installSteps"></div>
  <button class="btn" type="button" onclick="this.closest('dialog').close()">Entendi</button>
</div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/install.js"></script>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);
let main=$('#main');
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const brl=n=>isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}):'—';
const brl2=n=>isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const num=v=>{const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
async function api(body){try{await fetch('/api/lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})}catch{}}
const ICON={
 money:'<path d="M12 2v20M17 6.5C17 4.6 14.8 3.5 12 3.5S7 4.6 7 6.5 9.2 9.5 12 10s5 1.6 5 3.5S14.8 17 12 17s-5-1.1-5-3"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
 scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 check:'<path d="M5 12l4 4 10-10"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h4"/>'
};
const ic=k=>`<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>`;
const TOOLS=[
 {id:'cobrar',ic:'money',t:'Quanto cobrar pela consulta',d:'Custo real da sua hora e o preço mínimo para fechar o mês no azul.'},
 {id:'convenios',ic:'chart',t:'Quanto cada convênio paga de verdade',d:'Glosa, imposto e prazo na conta: veja quem dá lucro por hora.'},
 {id:'documentos',ic:'doc',t:'Gerador de documentos',d:'Atestado, comparecimento, encaminhamento e orientações, prontos para imprimir.'},
 {id:'raiox',ic:'scan',t:'Raio-X do consultório',d:'12 perguntas e uma nota de 0 a 100 de como o paciente encontra e marca com você.'},
 {id:'scripts',ic:'chat',t:'Scripts para a secretária',d:'Confirmação, falta, remarcação, retorno e pedido de avaliação. É só copiar.'},
 {id:'lgpd',ic:'shield',t:'Checklist LGPD do consultório',d:'O que precisa estar em ordem para proteger os dados dos pacientes.'}
];
const SOON=[
 {id:'escriba',ic:'mic',t:'Escriba de consulta com IA',d:'Fale a consulta e receba a evolução pronta para o prontuário.'},
 {id:'glosas',ic:'search',t:'Auditor de glosas',d:'Envie o demonstrativo do convênio e veja o que foi glosado e como recorrer.'},
 {id:'cfm',ic:'check',t:'Verificador CFM',d:'Cole um post ou anúncio e veja o que pode dar problema no conselho.'},
 {id:'simulador',ic:'users',t:'Simulador para a secretária',d:'Treino com uma IA no papel de paciente difícil, com nota e feedback.'},
 {id:'pfpj',ic:'calc',t:'PF ou PJ: quanto você pagaria',d:'Compare carnê-leão e empresa com os seus números.'}
];

/* ---------- login / cadastro ---------- */
async function auth(path,body){const r=await fetch('/api/auth/'+path,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||'Não foi possível agora. Tente de novo.');return j.user}
function onboarding(mode){
  mode=mode||(ls.get('axl_had_account',false)?'login':'signup');
  $('#bar').hidden=true;$('#foot').hidden=true;
  const pw=(id,ac)=>`<div class="pw"><input id="${id}" name="senha" type="password" required autocomplete="${ac}" minlength="8" placeholder="Mínimo 8 caracteres"><button type="button" class="eye" aria-label="Mostrar senha" data-eye="${id}">Mostrar</button></div>`;
  main.innerHTML=`<div class="onb">
  <div class="onb-l">
    <a class="brand" href="/lab/" aria-label="Voltar ao AXIS Lab"><svg width="30" height="34" viewBox="0 0 44 50" aria-hidden="true"><polygon points="21,2 0,46 15,46" fill="#F2EBDD"/><polygon points="22,5 42,46 28,46 20.5,19" fill="#7FB89A"/></svg><b>AXIS</b><span>LAB</span></a>
    <div>
      <div class="eyebrow" style="color:var(--sage-2)">Grátis para médicos</div>
      <h1>Ferramentas que organizam o seu <em>consultório.</em></h1>

/* ---------- quanto cobrar ---------- */
function cobrar(){
  const d=ls.get('axl_cobrar',{aluguel:3500,secretaria:3200,sistemas:400,contador:600,mkt:1500,outros:800,prolabore:25000,imp:12,cartao:3,horas:30,cph:2,ocup:75,faltas:12});
  const F=[['aluguel','Aluguel e condomínio'],['secretaria','Secretária (salário + encargos)'],['sistemas','Sistemas e softwares'],['contador','Contador'],['mkt','Marketing'],['outros','Outros custos fixos']];
  main.innerHTML=head('Quanto cobrar pela consulta','Coloque os seus números. Tudo fica só neste aparelho.')+`
  <div class="split"><div class="form-col card form-sec" id="cf">
    <h3>Custos fixos por mês (R$)</h3>
    <div class="grid2">${F.map(([k,l])=>`<div class="field"><label for="c-${k}">${l}</label><input id="c-${k}" data-k="${k}" inputmode="decimal" value="${d[k]}"></div>`).join('')}</div>
    <h3>Quanto você quer tirar por mês (R$)</h3>
    <div class="field"><label for="c-prolabore">Ganho líquido desejado</label><input id="c-prolabore" data-k="prolabore" inputmode="decimal" value="${d.prolabore}"></div>
    <h3>Agenda</h3>
    <div class="grid2">
      <div class="field"><label for="c-horas">Horas de atendimento por semana</label><input id="c-horas" data-k="horas" inputmode="decimal" value="${d.horas}"></div>
      <div class="field"><label for="c-cph">Consultas por hora</label><input id="c-cph" data-k="cph" inputmode="decimal" value="${d.cph}"></div>
      <div class="field"><label for="c-ocup">Agenda preenchida (%)</label><input id="c-ocup" data-k="ocup" inputmode="decimal" value="${d.ocup}"></div>
      <div class="field"><label for="c-faltas">Faltas (%)</label><input id="c-faltas" data-k="faltas" inputmode="decimal" value="${d.faltas}"></div>
    </div>
    <h3>Descontos sobre o que entra (%)</h3>
    <div class="grid2">
      <div class="field"><label for="c-imp">Impostos</label><input id="c-imp" data-k="imp" inputmode="decimal" value="${d.imp}"><p class="hint">Confirme a sua alíquota com o contador.</p></div>
      <div class="field"><label for="c-cartao">Taxa de cartão/maquininha</label><input id="c-cartao" data-k="cartao" inputmode="decimal" value="${d.cartao}"></div>
    </div>
  </div>
  <aside class="res" aria-live="polite" id="cr"></aside></div></div>`;
  const calc=()=>{
    const v={};main.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=num(i.value));ls.set('axl_cobrar',v);
    const fixos=F.reduce((s,[k])=>s+v[k],0);const horasMes=v.horas*4.33;
    const consultas=horasMes*v.cph*(v.ocup/100)*(1-v.faltas/100);
    const desc=(v.imp+v.cartao)/100;const fat=(fixos+v.prolabore)/Math.max(.01,1-desc);
    const preco=consultas>0?fat/consultas:NaN;const custoH=horasMes>0?fixos/horasMes:NaN;const empate=consultas>0?(fixos/Math.max(.01,1-desc))/consultas:NaN;
    $('#cr').innerHTML=`<div class="lbl">Preço mínimo por consulta</div><div class="big">${brl(Math.ceil(preco/10)*10)}</div>
      <p class="note">Abaixo disso você não chega ao ganho que definiu.</p>
      <div><div class="row"><span>Consultas realizadas por mês</span><b>${Math.round(consultas)||0}</b></div>
      <div class="row"><span>Custos fixos por mês</span><b>${brl(fixos)}</b></div>
      <div class="row"><span>Custo de cada hora aberta</span><b>${brl(custoH)}</b></div>
      <div class="row"><span>Preço só para pagar as contas</span><b>${brl(empate)}</b></div>
      <div class="row"><span>Faturamento necessário</span><b>${brl(fat)}</b></div></div>
      <p class="note">Cada 10% a menos de faltas reduz o preço mínimo em cerca de ${brl(preco-(fat/(horasMes*v.cph*(v.ocup/100)*(1-Math.max(0,v.faltas-10)/100))))}. Confirmação de consulta ajuda aqui.</p>`;
  };
  main.addEventListener('input',calc);calc();
}

/* ---------- convênios ---------- */
function convenios(){
  const d=ls.get('axl_conv',{part:400,cphPart:2,imp:12,taxa:1,rows:[{n:'Convênio A',v:110,dias:60,g:5,cph:3},{n:'Convênio B',v:180,dias:45,g:8,cph:2},{n:'Convênio C',v:90,dias:90,g:12,cph:3}]});
  main.innerHTML=head('Quanto cada convênio paga de verdade','Coloque o valor que cada convênio paga por consulta. A conta desconta glosa, imposto e o custo de esperar o pagamento.')+`
  <div class="split"><div class="form-col card form-sec">
    <h3>Particular</h3>
    <div class="grid3">
      <div class="field"><label for="v-part">Valor da consulta (R$)</label><input id="v-part" inputmode="decimal" value="${d.part}"></div>
      <div class="field"><label for="v-cphp">Consultas por hora</label><input id="v-cphp" inputmode="decimal" value="${d.cphPart}"></div>
      <div class="field"><label for="v-imp">Impostos (%)</label><input id="v-imp" inputmode="decimal" value="${d.imp}"></div>
    </div>
    <h3>Convênios</h3>
    <div class="cv" id="cv"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost sm" type="button" id="cvAdd">+ Adicionar convênio</button></div>
    <div class="field" style="max-width:260px"><label for="v-taxa">Custo do dinheiro parado (% ao mês)</label><input id="v-taxa" inputmode="decimal" value="${d.taxa}"><p class="hint">Quanto o atraso no pagamento custa para você.</p></div>
  </div><aside class="res" id="vr" aria-live="polite"></aside></div></div>`;
  const cv=$('#cv');
  const rowH=(r,i)=>`<div class="cv-row" data-i="${i}">
    <div class="field"><label>Convênio</label><input data-f="n" value="${esc(r.n)}"></div>
    <div class="field"><label>R$ por consulta</label><input data-f="v" inputmode="decimal" value="${r.v}"></div>
    <div class="field"><label>Glosa (%)</label><input data-f="g" inputmode="decimal" value="${r.g}"></div>
    <div class="field"><label>Paga em (dias)</label><input data-f="dias" inputmode="decimal" value="${r.dias}"></div>
    <button class="x" type="button" aria-label="Remover ${esc(r.n)}" data-del="${i}">×</button>
    <div class="field" style="grid-column:1/-1;max-width:220px"><label>Consultas por hora neste convênio</label><input data-f="cph" inputmode="decimal" value="${r.cph}"></div></div>`;
  const draw=()=>{cv.innerHTML=d.rows.map(rowH).join('');calc()};
  const read=()=>{d.part=num($('#v-part').value);d.cphPart=num($('#v-cphp').value);d.imp=num($('#v-imp').value);d.taxa=num($('#v-taxa').value);
    cv.querySelectorAll('.cv-row').forEach(el=>{const r=d.rows[+el.dataset.i];el.querySelectorAll('[data-f]').forEach(i=>r[i.dataset.f]=i.dataset.f==='n'?i.value:num(i.value))});ls.set('axl_conv',d)};
  const calc=()=>{read();
    const imp=d.imp/100;const partH=d.part*(1-imp)*d.cphPart;
    const list=d.rows.map(r=>{const liq=r.v*(1-r.g/100)*(1-imp)*(1-(d.taxa/100)*(r.dias/30));return{n:r.n||'Sem nome',liq,h:liq*r.cph}}).sort((a,b)=>b.h-a.h);
    const max=Math.max(partH,...list.map(x=>x.h),1);
    $('#vr').innerHTML=`<div class="lbl">Quanto entra por hora de agenda</div>
    <div class="bars"><div class="barrow"><div class="t"><b>Particular</b><span>${brl(partH)}/h</span></div><div class="track"><div class="fill" style="width:${partH/max*100}%"></div></div></div>
    ${list.map(x=>`<div class="barrow"><div class="t"><b>${esc(x.n)}</b><span>${brl(x.h)}/h · ${brl2(x.liq)} líq./consulta</span></div><div class="track"><div class="fill ${x.h<partH*.5?'bad':''}" style="width:${Math.max(2,x.h/max*100)}%"></div></div></div>`).join('')}</div>
    ${list.length?`<p class="note">${esc(list[list.length-1].n)} rende ${brl(list[list.length-1].h)} por hora, ${Math.round((1-list[list.length-1].h/Math.max(partH,1))*100)}% menos que uma hora de particular. Vale avaliar se a agenda dele não deveria virar horário particular.</p>`:''}
    <p class="note">Conta simplificada: valor × (1 − glosa) × (1 − imposto) × (1 − custo do prazo).</p>`;
  };
  main.addEventListener('input',calc);
  cv.addEventListener('click',e=>{const i=e.target.dataset.del;if(i!==undefined){read();d.rows.splice(+i,1);draw()}});
  $('#cvAdd').addEventListener('click',()=>{read();d.rows.push({n:'Novo convênio',v:100,dias:60,g:5,cph:3});draw()});
  draw();
}

    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="button" onclick="print()">Imprimir ou salvar PDF</button><button class="btn ghost" type="button" id="d-copy">Copiar texto</button></div>
  </div>
  <div><article class="doc" id="doc" aria-label="Pré-visualização do documento"></article></div></div></div>`;
  const g=id=>$('#'+id).value.trim();
  const fmt=s=>{if(!s)return'___/___/____';const[y,m,dd]=s.split('-');return`${dd}/${m}/${y}`};
  const ext=s=>{const n=new Date(s+'T12:00:00');return isNaN(n)?'':n.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})};
  const draw=()=>{

    if(t==='atestado'){const d=parseInt(g('d-dias'))||1;T='Atestado médico';B=`Atesto, para os devidos fins, que ${pac} esteve sob meus cuidados em ${data}, necessitando de afastamento de suas atividades por ${d} (${d===1?'um':d}) dia${d>1?'s':''} a partir desta data.${g('d-cid10')?`\n\nCID: ${g('d-cid10')} (informado com autorização do paciente).`:''}`}
    if(t==='comparecimento'){T='Declaração de comparecimento';B=`Declaro, para os devidos fins, que ${pac} compareceu a consulta médica neste consultório em ${data}${g('d-hora')?`, no horário de ${g('d-hora')}`:''}.`}
    if(t==='encaminhamento'){T='Encaminhamento';B=`Ao(À) colega de ${g('d-para')||'[especialidade]'},\n\nEncaminho o(a) paciente ${pac} para avaliação e conduta.\n\n${g('d-txt')||'[motivo do encaminhamento e resumo clínico]'}\n\nAgradeço a atenção e coloco-me à disposição.`}
    if(t==='orientacoes'){T='Orientações';const it=(g('d-txt')||'[escreva cada orientação em uma linha]').split('\n').filter(Boolean);B=`${pac},\n\n`+it.map(x=>'• '+x).join('\n')+`\n\nEm caso de piora ou dúvida, entre em contato com o consultório ou procure atendimento de urgência.`}
    $('#doc').innerHTML=`<div class="dh"><b>${esc(g('d-med')||'[nome do médico]')}</b><small>${esc([g('d-esp'),g('d-crm')].filter(Boolean).join(' · '))}</small></div><h2>${T}</h2><div class="body">${esc(B)}</div>
      <div class="sign"><p style="margin-bottom:46px">${esc(g('d-cid')||'')}${g('d-cid')?', ':''}${ext(g('d-data'))}</p><i></i>${esc(g('d-med')||'')}<br>${esc(g('d-crm')||'')}</div>`;

const RXR={Google:'Complete o Perfil da Empresa no Google com fotos reais, horários e link de agendamento, e peça avaliações depois de cada consulta.',Instagram:'Tenha uma rotina de conteúdo educativo (2 a 3 por semana) e uma bio com especialidade, cidade e link para marcar.',Site:'Um site simples, rápido no celular, com CRM/RQE e botão de WhatsApp, passa confiança para quem pesquisa você.',Atendimento:'Responder rápido e confirmar consultas é o que mais aumenta a agenda. Uma secretária de IA atende em segundos, a qualquer hora.'};
function raiox(p){
  const a=ls.get('axl_rx',{});
  let h=head('Raio-X do consultório','Responda com sinceridade. A nota mostra onde o paciente se perde entre encontrar você e marcar a consulta.')+'<div class="split"><div class="form-col card">';
  let last='';RX.forEach(([ar,q],i)=>{if(ar!==last){h+=`<div class="area">${ar}</div>`;last=ar}
    h+=`<div class="q" role="group" aria-label="${esc(q)}"><b>${q}</b><div class="opts">${[['2','Sim'],['1','Em parte'],['0','Não']].map(([v,l])=>`<button type="button" class="opt" data-q="${i}" data-v="${v}" aria-pressed="${a[i]===v}">${l}</button>`).join('')}</div></div>`});
  h+='</div><aside class="res" id="rr" aria-live="polite"></aside></div></div>';main.innerHTML=h;
  const calc=()=>{
    const done=Object.keys(a).length;const areas={};RX.forEach(([ar],i)=>{areas[ar]=areas[ar]||{s:0,n:0};areas[ar].n+=2;areas[ar].s+=+(a[i]??0)});
    const score=Math.round(RX.reduce((s,_,i)=>s+ +(a[i]??0),0)/(RX.length*2)*100);
    const weak=Object.entries(areas).sort((x,y)=>x[1].s/x[1].n-y[1].s/y[1].n).slice(0,2);
    $('#rr').innerHTML=done<RX.length?`<div class="lbl">Sua nota</div><div class="big">${done}/${RX.length}</div><p class="note">Responda todas as perguntas para ver a nota e o que priorizar.</p>`:
    `<div class="lbl">Nota do consultório</div><div class="big">${score}<span style="font-size:20px;opacity:.6">/100</span></div>
    <p class="note">${score>=80?'Muito bom. Agora é manter a constância.':score>=50?'Base boa, mas tem pacientes escapando no caminho.':'Tem muito paciente procurando e não chegando até você.'}</p>
    <div class="bars">${Object.entries(areas).map(([k,v])=>`<div class="barrow"><div class="t"><b>${k}</b><span>${Math.round(v.s/v.n*100)}%</span></div><div class="track"><div class="fill ${v.s/v.n<.5?'bad':''}" style="width:${Math.max(3,v.s/v.n*100)}%"></div></div></div>`).join('')}</div>
    <div class="lbl" style="margin-top:6px">Por onde começar</div><ul class="recs">${weak.map(([k])=>`<li>${RXR[k]}</li>`).join('')}</ul>
    <a class="btn" href="https://instagram.com/axismed_marketing" target="_blank" rel="noopener">Quero ajuda da AXIS com isso</a>`;
    if(done===RX.length&&!ls.get('axl_rx_sent',false)){ls.set('axl_rx_sent',true);api({type:'raiox',nota:score,...p})}
  };
  main.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;a[b.dataset.q]=b.dataset.v;ls.set('axl_rx',a);ls.set('axl_rx_sent',false);
    main.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));calc()});
  calc();
}

 'Cobrança':[['Lembrete gentil','Olá, [Nome]! Tudo bem? Identificamos que o pagamento referente a [serviço] de [data] ficou em aberto.\nSe já pagou, por favor desconsidere. Se preferir, envio a chave Pix: [chave].']]
};
function scripts(){
  const cats=Object.keys(SC);let cur=cats[0];
  main.innerHTML=head('Scripts para a secretária','Mensagens prontas para o WhatsApp. Troque o que está entre colchetes e copie.')+`<div class="tabs" role="tablist">${cats.map(c=>`<button class="opt" type="button" role="tab" data-c="${c}" aria-pressed="${c===cur}">${c}</button>`).join('')}</div><div class="scr" id="sc"></div></div>`;
  const draw=()=>{$('#sc').innerHTML=SC[cur].map(([t,x],i)=>`<div class="card"><div class="top"><h3>${t}</h3><button class="btn ghost sm" type="button" data-cp="${i}">Copiar</button></div><p>${esc(x)}</p></div>`).join('')};
  main.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){cur=c.dataset.c;main.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b===c));draw()}
    const k=e.target.closest('[data-cp]');if(k){navigator.clipboard?.writeText(SC[cur][+k.dataset.cp][1]).then(()=>toast('Mensagem copiada'))}});
  draw();
}

function lgpd(){

/* ---------- router ---------- */
const VIEWS={cobrar,convenios,documentos,raiox,scripts,lgpd};
let user;
async function loadUser(){try{const r=await fetch('/api/auth/me',{credentials:'same-origin'});const j=await r.json();return j.user||null}catch{return null}}
async function route(){
  const fresh=main.cloneNode(false);main.replaceWith(fresh);main=fresh;
  if(user===undefined){main.innerHTML='<div class="wrap" style="padding:80px 0;color:var(--mute)">Carregando…</div>';user=await loadUser()}
  if(!user){onboarding();return}
  $('#bar').hidden=false;$('#foot').hidden=false;
  const k=location.hash.replace(/^#\/?/,'');
  (VIEWS[k]||home)(user);scrollTo(0,0);
  document.title=(k&&VIEWS[k]?TOOLS.find(t=>t.id===k).t+' · ':'')+'AXIS Lab';
}
$('#logout').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}catch{}user=null;location.hash='';route()});
addEventListener('hashchange',()=>route());
route();
})();
